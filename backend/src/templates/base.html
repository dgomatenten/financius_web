{% load path_tags %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Financius Web{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-brand">
          <span class="hero-logo" aria-hidden="true">💰</span>
          <h1>Financius</h1>
        </div>
        <nav class="top-nav">
          <a href="/dashboard" {% if request.path == "/dashboard" %}aria-current="page"{% endif %}>
            <span aria-hidden="true">🏠</span> Dashboard
          </a>
          <a href="/receipts" {% if request.path|startswith:"/receipts" %}aria-current="page"{% endif %}>
            <span aria-hidden="true">🧾</span> Receipts
          </a>
          <a href="/budgets/overview" {% if request.path|startswith:"/budgets" %}aria-current="page"{% endif %}>
            <span aria-hidden="true">📊</span> Budgets
          </a>
          <a href="/analytics/dashboard" {% if request.path|startswith:"/analytics" %}aria-current="page"{% endif %}>
            <span aria-hidden="true">📈</span> Analytics
          </a>
          <div class="nav-group">
            <span class="nav-group-label">Data</span>
            <a href="/master-data/categories" {% if request.path|startswith:"/master-data/categories" %}aria-current="page"{% endif %}>Categories</a>
            <a href="/master-data/shops" {% if request.path|startswith:"/master-data/shops" %}aria-current="page"{% endif %}>Shops</a>
            <a href="/master-data/cards" {% if request.path|startswith:"/master-data/cards" %}aria-current="page"{% endif %}>Cards</a>
          </div>
          <a href="/sync/status" {% if request.path|startswith:"/sync" %}aria-current="page"{% endif %}>
            <span aria-hidden="true">🔄</span> Sync
          </a>
          <a href="/login" class="nav-auth" {% if request.path == "/login" %}aria-current="page"{% endif %}>Sign in</a>
          <button id="densityToggleBtn" class="nav-toggle" type="button" aria-pressed="false">⊡ Compact</button>
        </nav>
      </header>

      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/ui-density.js" defer></script>
  </body>
</html>
