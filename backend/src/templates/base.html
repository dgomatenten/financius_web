<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Financius Web{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>Financius Web Companion</h1>
        <nav class="top-nav">
          <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Home</a>
          <a href="/login" {% if request.path == '/login' %}aria-current="page"{% endif %}>Login</a>
          <a href="/register" {% if request.path == '/register' %}aria-current="page"{% endif %}>Register</a>
          <a href="/dashboard" {% if request.path == '/dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
          <a href="/receipts" {% if request.path == '/receipts' %}aria-current="page"{% endif %}>Receipts</a>
          <a href="/master-data/categories" {% if request.path.startswith('/master-data/categories') %}aria-current="page"{% endif %}>Categories</a>
          <a href="/master-data/shops" {% if request.path.startswith('/master-data/shops') %}aria-current="page"{% endif %}>Shops</a>
          <a href="/master-data/cards" {% if request.path.startswith('/master-data/cards') %}aria-current="page"{% endif %}>Cards</a>
          <a href="/budgets/settings" {% if request.path.startswith('/budgets/settings') %}aria-current="page"{% endif %}>Budgets</a>
          <a href="/budgets/overview" {% if request.path.startswith('/budgets/overview') %}aria-current="page"{% endif %}>Bud. Overview</a>
          <a href="/analytics/dashboard" {% if request.path.startswith('/analytics') %}aria-current="page"{% endif %}>Analytics</a>
          <a href="/sync/status" {% if request.path.startswith('/sync/status') %}aria-current="page"{% endif %}>Sync</a>
          <a href="/sync/pairing" {% if request.path.startswith('/sync/pairing') %}aria-current="page"{% endif %}>Pairing</a>
          <button id="densityToggleBtn" class="nav-toggle" type="button" aria-pressed="false">Compact</button>
        </nav>
      </header>

      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/ui-density.js" defer></script>
  </body>
</html>
