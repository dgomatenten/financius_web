{% extends "base.html" %}

{% block title %}Financius Web{% endblock %}

{% block content %}
      <section class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <label>
            Email
            <input id="email" type="email" required />
          </label>
          <label>
            Password
            <input id="password" type="password" required />
          </label>
          <button type="submit">Login</button>
        </form>
        <pre id="loginOut" class="out"></pre>
      </section>
      <script src="/static/web.js" defer></script>
{% endblock %}
