services:
  - type: web
    name: financius-web
    runtime: docker
    dockerfilePath: ./infra/docker/backend.Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: false  # CI controls deploys via deploy hook

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: financius_web.settings
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DJANGO_DATABASE_URL
        fromDatabase:
          name: financius-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        value: replace-me
      - key: API_BASE_URL
        value: https://financius-web.onrender.com
      - key: ALLOWED_HOSTS
        value: financius-web.onrender.com

databases:
  - name: financius-db
    plan: free
    databaseName: financius
    user: financius
