services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financius
      POSTGRES_USER: financius
      POSTGRES_PASSWORD: financius_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financius"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      - DJANGO_DATABASE_URL=postgres://financius:financius_dev@db:5432/financius
    ports:
      - "8001:10000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
